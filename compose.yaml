name: student-app

services:
  api:
    build: .
    environment:
      ROLE: api
      PORT: 8000
      DATA_DIR: /data
    volumes:
      - api_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 3s
      timeout: 3s
      retries: 5
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    profiles: ["monitoring"]

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    profiles: ["monitoring"]

  web:
    build: .
    environment:
      ROLE: web
      PORT: 8000
      API_URL: http://api:8000
    ports:
      - "8080:8000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  api_data:
